[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waylens-ai-gateway"
version = "0.1.0"
description = "Account management, API authentication, quotas and inference proxy"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.115.6", "uvicorn==0.30.0", "httpx==0.28.1",
  "imageio-ffmpeg==0.8.1", "websockets==12.0", "async-timeout==5.0.1", "python-multipart==0.0.20", "email-validator>=2,<3",
]

[project.optional-dependencies]
clients = ["numpy>=1.26", "soundfile>=0.12"]

[tool.setuptools.packages.find]
include = ["accounts*", "gateway*", "scripts*"]
exclude = ["accounts.data*"]

[tool.setuptools.package-data]
accounts = ["static/*"]

[tool.ruff]
target-version = "py310"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
