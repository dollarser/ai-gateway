name: Gateway checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m venv .venv-accounts
      - run: .venv-accounts/bin/pip install -r requirements/gateway.lock && .venv-accounts/bin/pip install -e . --no-deps
      - run: .venv-accounts/bin/python -m scripts.setup.create_client_id
      - run: .venv-accounts/bin/python -m tests.run
      - run: git diff --check
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - run: npm test
